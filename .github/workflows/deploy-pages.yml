name: Deploy resident hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Sync ERL issues from Google Sheets'
      - 'Sync ERL fund data from Google Sheets'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A sheet sync may fail validation. Publish only after successful syncs,
    # while retaining normal push and manual deployments.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run starts from the commit that defined the workflow,
          # so explicitly pick up the data commit pushed by the completed sync.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO_NAME}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
          else
            export NEXT_PUBLIC_BASE_PATH="/${REPO_NAME}"
          fi
          npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
