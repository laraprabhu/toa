name: Sync ERL document data from Google Sheets

on:
  schedule:
    # 20:40 UTC is 02:10 IST on the following calendar day. This follows
    # the civil and fund syncs and shares their concurrency group.
    - cron: '40 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erl-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the document importer
        run: node --test lib/erl-documents-sync.test.mjs
      - name: Import the document tracker
        run: node scripts/sync-erl-documents.mjs
      - name: Commit updated document data
        run: |
          if git diff --quiet -- content/erl-issues/document-checklist.json; then
            echo "The Google Sheet has no document changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/erl-issues/document-checklist.json
          git commit -m "Sync ERL document data from Google Sheets"
          git push
