name: Sync ERL issues from Google Sheets

on:
  schedule:
    # 20:30 UTC is 02:00 IST on the following calendar day.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erl-issues-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import the issue tracker
        run: node scripts/sync-erl-issues.mjs
      - name: Commit updated issue data
        run: |
          if git diff --quiet -- content/erl-issues/issues.json; then
            echo "The Google Sheet has no tracker changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/erl-issues/issues.json
          git commit -m "Sync ERL issues from Google Sheets"
          git push
