name: Sync ERL fund data from Google Sheets

on:
  schedule:
    # 20:35 UTC is 02:05 IST on the following calendar day. This follows
    # the civil sync and shares its concurrency group to avoid push races.
    - cron: '35 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erl-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import the fund tracker
        run: node scripts/sync-erl-funds.mjs
      - name: Commit updated fund data
        run: |
          if git diff --quiet -- content/erl-issues/fund-data.json; then
            echo "The Google Sheet has no fund changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/erl-issues/fund-data.json
          git commit -m "Sync ERL fund data from Google Sheets"
          git push
